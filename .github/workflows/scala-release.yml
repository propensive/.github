name: Scala Release

# Reusable release workflow for Soundness-ecosystem repositories: publish the tagged version to
# GitHub Releases. The caller triggers it on a pushed `X.Y.Z` tag; everything it does lives in
# `scripts/release.sh` in this repository, run through `etc/shared` at the commit the caller pins
# in `etc/github-ref`, and everything that varies between repositories is declared in the
# caller's `etc/release`. There are therefore no per-repository inputs.
#
# Contract with the caller: a checked-in `./mill` bootstrap wrapper; `etc/shared` and
# `etc/github-ref`; `etc/refs` and `etc/tools`; `etc/release`; an `object release` in build.mill
# with a `stage` task; and the `SOUNDNESS_SCALA_RELEASE` pin in build.mill. The calling job must
# grant `permissions: contents: write` — the organisation default is read-only, and a release
# writes assets and the release itself, and on failure deletes the tag it was triggered by. A
# caller with an `etc/downstream` also passes `secrets: inherit`, for PROPAGATE_TOKEN below.
#
# A caller that signs its executables (committed `etc/keys/release.pub`) passes
# `environment: release` and `secrets: inherit`; `release` is the GitHub environment holding
# the release key's seed as the secret
# UPGRADE_SIGNING_SEED. It is an environment secret, not a repository secret: a repository secret
# can be read by any workflow on any branch, whereas the environment admits only the release tags
# and waits for a reviewer's approval. The job below names the environment itself, so the secret
# is the CALLER's environment's; but a called workflow sees only the secrets its caller passes,
# even those of that environment, so without `secrets: inherit` the seed arrives empty.

on:
  workflow_call:
    inputs:
      timeout:
        description: Job timeout in minutes
        type: number
        default: 90
      # The caller's environment the release job runs in; none by default.
      environment:
        description: The environment holding UPGRADE_SIGNING_SEED, for a signed release
        type: string
        default: ''
    # Optional. A token with contents and pull-requests write access to the repositories named in
    # the caller's `etc/downstream`, to which the published release is proposed as draft pull
    # requests (scripts/propagate.py); the job's own token reaches no other repository. A caller
    # passes it with `secrets: inherit`; without it, the release is published and nothing is
    # proposed.
    secrets:
      PROPAGATE_TOKEN:
        required: false
      # Declared so that the step below may name it; it is the secret of the environment the job
      # runs in, and reaches the job only when the caller passes `secrets: inherit`. Keep it there,
      # and never as a repository secret, which any workflow on any branch could read.
      UPGRADE_SIGNING_SEED:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    # An empty name runs the job in no environment, as before.
    environment: ${{ inputs.environment }}
    steps:
      # The tag, and the whole history: release.sh needs the previous release tag to assemble the
      # changelog, and Soundness's attestation gate recomputes the filtered tree of the commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Attestation notes live on a ref Actions does not fetch by default. Every repository but
      # Soundness has nothing to fetch; `|| true` so that a missing ref reaches the gate in
      # release.sh as a readable error rather than failing the checkout.
      - name: Fetch CI attestation notes
        run: git fetch origin 'refs/notes/ci-attestation:refs/notes/ci-attestation' || true

      # The toolchain pin lives in the caller's build.mill, exactly as in scala-ci.yml.
      - name: Read version pins
        id: pins
        run: |
          echo "scala=$(sed -n 's/.*SOUNDNESS_SCALA_RELEASE", "\(.*\)").*/\1/p' build.mill)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # The same three caches as scala-ci.yml, keyed the same way — and deliberately NOT `out/`.
      # A release builds from a cold tree, which is what the `./mill clean` in every superseded
      # release script was defending against: a warm `out/` can re-serve a `publishVersion`
      # computed before the tag existed (this is how 0.64.0 shipped 0.63.0 plugin jars).
      - name: Cache pinned libraries
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/local/dev.propensive
          key: deps-${{ hashFiles('etc/refs') }}
      - name: Cache proscala toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/soundness/proscala
          key: proscala-${{ steps.pins.outputs.scala }}
      - name: Cache coursier
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill') }}
          restore-keys: coursier-

      # The tag name is the version; release.sh reads it from GITHUB_REF_NAME. The token lifts
      # the API rate limit for deps.py and authenticates `gh` for everything else.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROPAGATE_TOKEN: ${{ secrets.PROPAGATE_TOKEN }}
          # Only in this step, and release.sh unsets it before running anything else.
          UPGRADE_SIGNING_SEED: ${{ secrets.UPGRADE_SIGNING_SEED }}
        run: ./etc/shared release.sh
