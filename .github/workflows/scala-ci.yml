name: Scala CI

# Reusable CI for Soundness-ecosystem applications: install every library pinned in the
# caller's etc/refs (releases and snapshots alike, transitively — see scripts/deps.py) from
# GitHub Releases into ~/.ivy2/local, compile, publish any locally-resolved module, assemble,
# and run the test suite. Callers name their Mill targets; the pins are read from the CALLER's
# repository, so a dependency or toolchain bump re-keys the caches and re-syncs with no
# workflow change.
#
# Contract with the caller: a checked-in `./mill` bootstrap wrapper, `etc/shared` with
# `etc/github-ref` (the pinned commit of this repository whose scripts run), `etc/refs`,
# and the `SOUNDNESS_SCALA_RELEASE` pin in build.mill.

on:
  workflow_call:
    inputs:
      compile:
        description: Space-separated Mill compile targets, built in order
        type: string
        default: ""
      publish_local:
        description: A module to publishLocal before assembling (for launcher-style modules
          that resolve a sibling as a published coordinate)
        type: string
        default: ""
      assembly:
        description: Space-separated Mill assembly targets, built in order
        type: string
        default: ""
      test_assembly:
        description: The Mill assembly target holding the test suite; no tests are run if empty
          (for a repository whose suites need a host runner, such as xeq's)
        type: string
        default: ""
      test_main:
        description: The test suite's main class
        type: string
        default: ""
      timeout:
        description: Job timeout in minutes
        type: number
        default: 60

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v5

      # The toolchain pin lives in the caller's build.mill; the library pins in etc/refs.
      - name: Read version pins
        id: pins
        run: |
          echo "scala=$(sed -n 's/.*SOUNDNESS_SCALA_RELEASE", "\(.*\)").*/\1/p' build.mill)" >> "$GITHUB_OUTPUT"

      # Mill's bootstrap needs a JVM to start from; the build provisions its own toolchain
      # JVM, but the test suite runs with plain `java`, so this must be at least the bytecode
      # level the build targets.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Keyed by the pin file: a bump, or a snapshot pin, re-syncs; anything else is a hit.
      - name: Cache pinned libraries
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/local/dev.propensive
          key: deps-${{ hashFiles('etc/refs') }}
      - name: Cache proscala toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/soundness/proscala
          key: proscala-${{ steps.pins.outputs.scala }}
      - name: Cache coursier
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill') }}
          restore-keys: coursier-

      # Every pinned library is per-component jars on GitHub Releases, each embedding its own
      # POM and ivy.xml, from which the sync script (run at the commit of this repository the
      # caller pins in etc/github-ref) reconstructs the ivy2 layout coursier resolves from. A
      # snapshot pin resolves to its `snapshot-<hex>` pre-release; there is no sibling checkout
      # here, so a snapshot nobody has published fails the build by name. The token only lifts
      # the API rate limit. Idempotent: digest-matched jars are left alone.
      - name: Sync the pinned libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./etc/shared sync-deps.sh

      - name: Compile
        if: inputs.compile != ''
        run: |
          for target in ${{ inputs.compile }}; do ./mill "$target"; done

      - name: Publish locally
        if: inputs.publish_local != ''
        run: ./mill ${{ inputs.publish_local }}.publishLocal

      - name: Assemble
        if: inputs.assembly != ''
        run: |
          for target in ${{ inputs.assembly }}; do ./mill "$target"; done

      # The assembly's jar lands at out/<target with dots as slashes>.dest/out.jar.
      - name: Run the tests
        if: inputs.test_assembly != ''
        run: |
          ./mill ${{ inputs.test_assembly }}
          jar="out/$(echo "${{ inputs.test_assembly }}" | tr '.' '/').dest/out.jar"
          java -cp "$jar" ${{ inputs.test_main }}
