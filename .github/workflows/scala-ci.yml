name: Scala CI

# Reusable CI for Soundness-ecosystem applications: install the tools pinned in the caller's
# etc/tools, compile, publish any locally-resolved module, assemble, and run the test suites
# with fume. The libraries pinned in the caller's etc/refs (releases and snapshots alike,
# transitively) and the Proscala compiler are resolved by the build itself, through crux
# (propensive/crux), from their GitHub releases. Callers name their Mill targets.
#
# Contract with the caller: a checked-in `./mill` bootstrap wrapper, `etc/shared` with
# `etc/github-ref` (the pinned commit of this repository whose scripts run), and `etc/refs`.

on:
  workflow_call:
    inputs:
      compile:
        description: Space-separated Mill compile targets, built in order
        type: string
        default: ""
      publish_local:
        description: A module to publishLocal before assembling (for launcher-style modules
          that resolve a sibling as a published coordinate)
        type: string
        default: ""
      assembly:
        description: Space-separated Mill assembly targets, built in order
        type: string
        default: ""
      test_assembly:
        description: The Mill assembly target holding the test suites, which fume — the
          release pinned in the caller's etc/tools — discovers and runs; no tests are run if
          empty
        type: string
        default: ""
      test_main:
        description: A main class in the test assembly to run the suites with, under plain
          `java`, in place of fume — for a repository whose pinned fume cannot run (as when
          fume itself is being rebuilt); empty, the default, runs them through fume
        type: string
        default: ""
      timeout:
        description: Job timeout in minutes
        type: number
        default: 60

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v5

      # Mill's bootstrap needs a JVM to start from; the build provisions its own toolchain
      # JVM, but the test suite runs with plain `java`, so this must be at least the bytecode
      # level the build targets.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache coursier
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill') }}
          restore-keys: coursier-

      # The pinned libraries and the Proscala compiler are resolved by the build itself, through
      # crux (propensive/crux), straight from their GitHub releases into the coursier cache above;
      # nothing is installed into ~/.ivy2/local. A snapshot pin resolves to its `snapshot-<hex>`
      # pre-release, so a snapshot nobody has published fails the build by name.

      # The commands pinned in etc/tools — fume, for the tests — installed through their
      # releases' installers into ~/.local/bin, which is put on the path for the later steps.
      - name: Install the pinned tools
        if: inputs.test_assembly != ''
        run: |
          ./etc/shared tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile
        if: inputs.compile != ''
        run: |
          for target in ${{ inputs.compile }}; do ./mill "$target"; done

      - name: Publish locally
        if: inputs.publish_local != ''
        run: ./mill ${{ inputs.publish_local }}.publishLocal

      - name: Assemble
        if: inputs.assembly != ''
        run: |
          for target in ${{ inputs.assembly }}; do ./mill "$target"; done

      # The assembly's jar lands at out/<target with dots as slashes>.dest/out.jar. fume
      # discovers every suite in it from the META-INF/services/probably.Suite index, renders
      # tersely under GitHub Actions, and exits 1 when a test fails — the same runner and the
      # same output as `make test` locally. With `test_main`, the suites run under plain `java`
      # through that class instead (one line per test; the exit status is the suite's), for a
      # repository whose pinned fume cannot run here.
      - name: Run the tests
        if: inputs.test_assembly != ''
        run: |
          ./mill ${{ inputs.test_assembly }}
          jar="out/$(echo "${{ inputs.test_assembly }}" | tr '.' '/').dest/out.jar"
          if [ -n "${{ inputs.test_main }}" ]; then
            java -cp "$jar" "${{ inputs.test_main }}"
          else
            fume run -c "$jar"
          fi
